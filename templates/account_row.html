<tr id="row-{{ name|replace(" ", "-") }}">
    <td>
        <div class="asset-info">
            <div class="asset-icon">
                <i data-lucide="wallet" style="width: 16px; height: 16px;"></i>
            </div>
            <div>
                <div class="asset-name rename-label">
                    <span>{{ name }}</span>
                    <button class="rename-btn" title="Rename" onclick="startRename(this)">
                        <i data-lucide="pencil" style="width: 12px; height: 12px;"></i>
                    </button>
                </div>
                <form class="rename-form" hidden hx-patch="/accounts/{{ name }}" hx-swap="none">
                    <input type="text" name="new_name" value="{{ name }}" class="rename-input">
                    <span class="rename-error"></span>
                </form>
                <div class="asset-symbol truncate" title="{{ address }}">{{ address }}</div>
            </div>
        </div>
    </td>
    <td>{{ company }}</td>
    <td><span class="chain-badge">{{ chain }}</span></td>
    <td class="amount">--</td>
    <td class="amount">--</td>
    <td class="amount">--</td>
    <td>
        <div class="row-actions">
            <button class="btn btn-secondary btn-sm"
                    hx-get="/balances/{{ name }}"
                    hx-target="#detail-{{ name|replace(" ", "-") }}"
                    hx-swap="innerHTML"
                    hx-indicator="#spinner-{{ name|replace(" ", "-") }}">
                <span class="spinner htmx-indicator" id="spinner-{{ name|replace(" ", "-") }}"></span>
                Query
            </button>
            <button class="btn btn-secondary btn-sm"
                    hx-get="/transactions/{{ name }}"
                    hx-target="#detail-{{ name|replace(" ", "-") }}"
                    hx-swap="innerHTML">
                Txns
            </button>
            <button class="btn btn-secondary btn-sm btn-danger"
                    hx-delete="/accounts/{{ name }}"
                    hx-target="#row-{{ name|replace(" ", "-") }}"
                    hx-swap="outerHTML"
                    hx-confirm="Remove {{ name }}?">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
            </button>
        </div>
    </td>
</tr>
<tr class="detail-row">
    <td colspan="7" id="detail-{{ name|replace(" ", "-") }}"></td>
</tr>
