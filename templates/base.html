<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gringotts - {% block title %}Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Background colors */
            --bg-page: #0A0A0B;
            --bg-surface: #111113;
            --bg-elevated: #1A1A1D;
            --bg-interactive: #2A2A2E;

            /* Border colors */
            --border-default: #2A2A2E;
            --border-subtle: #1F1F23;

            /* Text colors */
            --text-primary: #FFFFFF;
            --text-secondary: #ADADB0;
            --text-tertiary: #8B8B90;
            --text-disabled: #6B6B70;
            --text-placeholder: #4A4A4E;
            --text-muted: rgba(255, 255, 255, 0.8);

            /* Accent colors */
            --orange-primary: #FF5C00;
            --orange-light: #FF8A4C;
            --orange-tint: rgba(255, 92, 0, 0.1);
            --green-success: #22C55E;
            --green-tint: rgba(34, 197, 94, 0.1);
            --red-error: #EF4444;

            /* Typography */
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Instrument Serif', Georgia, serif;
            --font-mono: 'DM Mono', 'SF Mono', Monaco, monospace;

            /* Spacing & Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            /* Sidebar */
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-surface);
            border-left: 3px solid var(--orange-primary);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px;
            height: 88px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo-text {
            font-family: var(--font-mono);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--text-primary);
        }

        .logo-dot {
            width: 6px;
            height: 6px;
            background: var(--orange-primary);
            border-radius: 50%;
        }

        .sidebar-nav {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .nav-item.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-weight: 500;
        }

        .nav-item.active i {
            color: var(--orange-primary);
        }

        .nav-item i {
            width: 18px;
            height: 18px;
            color: var(--text-disabled);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            overflow-y: auto;
            max-height: 100vh;
        }

        /* Page Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 38px;
            font-weight: normal;
            letter-spacing: -1px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-disabled);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--orange-primary);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: var(--orange-light);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            background: var(--bg-interactive);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger {
            color: var(--red-error);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Metrics Row */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .metric-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-disabled);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -1px;
            color: var(--text-primary);
        }

        .metric-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .metric-info i {
            width: 14px;
            height: 14px;
            color: var(--text-disabled);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 500;
        }

        .status-indicator.success {
            background: var(--green-tint);
            color: var(--green-success);
        }

        .status-indicator i {
            width: 12px;
            height: 12px;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            padding: 14px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-disabled);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #0D0D0E;
            border-bottom: 1px solid var(--border-subtle);
        }

        .data-table td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 14px;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table .amount {
            font-family: var(--font-mono);
            text-align: right;
        }

        .data-table .positive {
            color: var(--green-success);
        }

        /* Asset Row */
        .asset-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .asset-name {
            font-weight: 500;
        }

        .asset-symbol {
            font-size: 12px;
            color: var(--text-disabled);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }

        /* Chain Badge */
        .chain-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--bg-elevated);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .chain-badge.bank {
            background: var(--green-tint);
            color: var(--green-success);
        }

        /* Forms */
        input, select {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-default);
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            transition: border-color 0.15s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--orange-primary);
        }

        input::placeholder {
            color: var(--text-placeholder);
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-row input, .form-row select {
            flex: 1;
            min-width: 140px;
        }

        /* Utilities */
        .truncate {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .text-muted {
            color: var(--text-disabled);
        }

        .empty {
            text-align: center;
            padding: 48px;
            color: var(--text-disabled);
        }

        /* Loading States */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-default);
            border-top-color: var(--orange-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        .spinner.large {
            width: 40px;
            height: 40px;
            border-width: 3px;
            display: block;
        }

        .htmx-request .spinner.htmx-indicator {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-card {
            text-align: center;
            padding: 48px;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading-content h2 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: normal;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.success {
            border-color: var(--green-success);
        }

        .toast.error {
            border-color: var(--red-error);
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .metrics-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                padding: 24px;
            }

            .metrics-row {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        {% block sidebar %}
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo-text">GRINGOTTS</span>
                <span class="logo-dot"></span>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#wallets" class="nav-item">
                    <i data-lucide="wallet"></i>
                    <span>Wallets</span>
                </a>
                <a href="#transactions" class="nav-item">
                    <i data-lucide="arrow-left-right"></i>
                    <span>Transactions</span>
                </a>
                <a href="#banking" class="nav-item">
                    <i data-lucide="landmark"></i>
                    <span>Banking</span>
                </a>
                <a href="#settings" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
        {% endblock %}

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Re-initialize icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
